<header class="flex items-center justify-between w-full px-6 py-4 text-white relative z-50">
  <!-- Zone gauche : Navigation principale -->
  <div class="navbar-gauche hidden md:flex gap-4">
    <nav id="main-nav" class="flex gap-4">
      <a class="link" href="/">ACCUEIL</a>
      <a class="link" href="/projets">PROJETS</a>
      <a class="link" href="/actus">ACTUS</a>
      <a class="link" href="/services">SERVICES</a>
      <span id="marker"></span>
    </nav>
  </div>

  <!-- Logo centré -->
  <div class="absolute left-1/2 transform -translate-x-1/2">
    <img class=" w-30 md:w-50" src="../assets/images/nova-logo-blanc-fond-noir.png" alt="logo nova corporation" />
  </div>

  <!-- Zone droite : Contact + Burger -->
  <div class="navbar-droite flex items-center gap-4">
    <a href="/contact" class="hidden md:inline">CONTACT</a>

    <!-- Burger menu visible uniquement sur mobile -->
    <button
      id="burger-btn"
      class="burger-btn md:hidden"
      aria-label="Ouvrir le menu"
      aria-expanded="false"
      aria-controls="mobile-nav"
    >
      <span class="burger-line"></span>
      <span class="burger-line"></span>
      <span class="burger-line"></span>
    </button>
  </div>

  <!-- Menu Mobile -->
  <nav id="mobile-nav" class="mobile-nav md:hidden" aria-hidden="true">
    <a class="mobile-link" href="/" style="--i: 0">ACCUEIL</a>
    <a class="mobile-link" href="/projets" style="--i: 1">PROJETS</a>
    <a class="mobile-link" href="/actus" style="--i: 2">ACTUS</a>
    <a class="mobile-link" href="/services" style="--i: 3">SERVICES</a>
    <a class="mobile-link" href="/contact" style="--i: 4">CONTACT</a>
  </nav>
</header>
